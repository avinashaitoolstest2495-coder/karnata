<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anek+Kannada:wght@700;800;900&family=Outfit:wght@800;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1080px;
    background: #FFD13B;
    font-family: 'Anek Kannada', sans-serif;
    color: #111827;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 0;
  }
  /* White Top Header Block (Reference 5) */
  .top-white {
    background: #FFFFFF;
    height: 380px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    box-shadow: 0 10px 25px rgba(0,0,0,0.06);
  }
  /* Angular Two-Tone Ribbon Badge (Reference 5) */
  .badge-yellow {
    background: #FFD13B;
    color: #111827;
    font-size: 34px;
    font-weight: 900;
    padding: 8px 36px;
    transform: skew(-6deg);
    border-radius: 4px;
    letter-spacing: 1px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  }
  .badge-black {
    background: #111827;
    color: #FFFFFF;
    font-size: 56px;
    font-weight: 900;
    padding: 12px 64px;
    transform: skew(-6deg);
    border-radius: 6px;
    margin-top: -12px;
    letter-spacing: 2px;
    box-shadow: 0 12px 25px rgba(0,0,0,0.25);
  }
  /* Warm Yellow Bottom Canvas (Reference 5) */
  .bottom-yellow {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px 90px 60px;
    text-align: center;
  }
</style>
</head>
<body>
  <!-- WHITE TOP HALF WITH ANGULAR BADGE (REFERENCE 5) -->
  <div class="top-white">
    <div class="badge-yellow">ನಿಮಗೆ</div>
    <div class="badge-black">ತಿಳಿದಿದೆಯೇ?</div>
  </div>

  <!-- WARM YELLOW BOTTOM HALF WITH CLEAN TYPOGRAPHY (REFERENCE 5) -->
  <div class="bottom-yellow">
    <div style="font-size:38px; font-weight:800; line-height:1.65; color:#111827; max-width:920px;">
      17ನೇ ಶತಮಾನದಲ್ಲಿ ಸೂಫಿ ಸಂತ ಬಾಬಾ ಬುಡನ್ ಅವರು ಯೆಮೆನ್‌ನಿಂದ ತಂದ 7 ಹಸಿ ಕಾಫಿ ಬೀಜಗಳನ್ನು ಚಿಕ್ಕಮಗಳೂರಿನ ಚಂದ್ರದ್ರೋಣ ಪರ್ವತದಲ್ಲಿ ಬಿತ್ತಿದರು. ಇಂದು ಭಾರತ ವಿಶ್ವದ ಪ್ರಮುಖ ಕಾಫಿ ರಫ್ತುದಾರ ದೇಶವಾಗಲು ಈ 7 ಕಾಫಿ ಬೀಜಗಳೇ ಮುನ್ನುಡಿ!
    </div>

    <!-- Minimalist Branding Handle -->
    <div style="margin-top:48px; font-size:24px; font-weight:800; color:#4B5563; font-family:'Outfit';">
      @karnata.in
    </div>
  </div>
</body>
</html>
