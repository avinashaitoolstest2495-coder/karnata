<script>
function slugify(text) {
  if (!text) return '';
  return text.toString().toLowerCase()
    .replace(/[^\w\s-]/g, '')
    .trim()
    .replace(/[\s_]+/g, '-')
    .replace(/^-+|-+$/g, '');
}

(async function initArticleView() {
  const urlPath = window.location.pathname.split('/').filter(Boolean);
  const searchParams = new URLSearchParams(window.location.search);
  
  let targetSlug = searchParams.get('slug') || searchParams.get('id');
  let targetCategory = searchParams.get('category');

  if (urlPath[0] === 'news' && urlPath.length >= 2) {
    if (urlPath.length >= 3) {
      targetCategory = urlPath[1];
      targetSlug = urlPath[2];
    } else {
      targetSlug = urlPath[1];
    }
  }

  if (targetSlug) {
    targetSlug = decodeURIComponent(targetSlug).trim();
  }

  let allCandidates = [];

  // 1. LocalStorage articles
  try {
    const store = JSON.parse(localStorage.getItem('nk_cms_articles') || '[]');
    allCandidates.push(...store);
  } catch(e) {}

  // 2. Fetch Worker API
  try {
    const res = await fetch('https://karnata-cms.avinashaitoolstest2495.workers.dev/admin/api/articles');
    if (res.ok) {
      const data = await res.json();
      allCandidates.push(...(data.articles || []));
    }
  } catch(e) {}

  // 3. Fetch static local news data
  try {
    const res = await fetch('/data/local_news.json');
    if (res.ok) {
      const raw = await res.json();
      const list = Object.values(raw.news || raw.district_buckets || {}).flat();
      allCandidates.push(...list);
    }
  } catch(e) {}

  let article = null;

  if (targetSlug) {
    const normTarget = slugify(targetSlug);

    // Exact ID or Slug match
    article = allCandidates.find(x => 
      x.id === targetSlug || 
      x.slug === targetSlug || 
      slugify(x.id) === normTarget || 
      slugify(x.slug) === normTarget ||
      slugify(x.title_en) === normTarget
    );

    // Partial matching if not found
    if (!article) {
      article = allCandidates.find(x => {
        const titleNorm = slugify(x.title_kn || x.title || '');
        return titleNorm && (titleNorm.includes(normTarget) || normTarget.includes(titleNorm));
      });
    }
  }

  // Fallback to latest published article if still null
  if (!article && allCandidates.length > 0) {
    article = allCandidates[0];
  }

  if (article) {
    const title = article.title_kn || article.title || 'ಸುದ್ದಿ ವಿವರಣೆ';
    document.getElementById('page-title').textContent = `${title} — Karnata.in`;
    document.getElementById('art-title').textContent = title;
    document.getElementById('art-category').textContent = `📰 ${article.category || targetCategory || 'ಪ್ರಮುಖ ಲೇಖನ'}`;
    document.getElementById('art-author').textContent = article.author || article.source_name || article.source || 'ಕರ್ನಾಟ ಸಂಪಾದಕೀಯ ತಂಡ';
    document.getElementById('art-date').textContent = new Date(article.updated_at || article.published || Date.now()).toLocaleDateString('kn-IN', { day: 'numeric', month: 'long', year: 'numeric' });
    
    if (article.cover_image) {
      const img = document.getElementById('art-cover');
      img.src = article.cover_image;
      img.style.display = 'block';
    }

    document.getElementById('art-body').innerHTML = article.body_html || `<p>${article.summary_kn || article.summary || title}</p>`;
    
    const waText = encodeURIComponent(`*${title}*\n\nಇಲ್ಲಿ ಓದಿ: ${window.location.href}`);
    document.getElementById('wa-share').href = `https://api.whatsapp.com/send?text=${waText}`;
  } else {
    document.getElementById('art-title').textContent = 'ವರದಿ ಲೋಡ್ ಆಗಿಲ್ಲ';
    document.getElementById('art-body').innerHTML = '<p>ಈ ಲೇಖನದ ಸಂಪೂರ್ಣ ವಿವರ ಸದ್ಯದಲ್ಲೇ ಪ್ರಕಟವಾಗಲಿದೆ.</p>';
  }
})();
