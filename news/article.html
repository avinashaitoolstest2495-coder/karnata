<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">ಸುದ್ದಿ ಲೇಖನ — Karnata.in (ಕರ್ನಾಟ)</title>
<meta name="description" id="page-desc" content="ಕರ್ನಾಟಕ ಸುದ್ದಿ, ವಿಶ್ಲೇಷಣೆ ಹಾಗೂ ಪ್ರಮುಖ ಬೆಳವಣಿಗೆಗಳು.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anek+Kannada:wght@400;600;700;800;900&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/karnata-theme.css">
<style>
body { font-family: 'Anek Kannada', sans-serif; background: #F8FAFC; color: #0F172A; margin: 0; padding: 0; }
.art-hero { background: linear-gradient(135deg, #0F172A 0%, #1E1B4B 100%); color: #FFF; padding: 48px 20px 36px; border-bottom: 4px solid #E11D48; }
.art-container { max-width: 860px; margin: -30px auto 80px; padding: 0 20px; position: relative; z-index: 10; }
.art-card { background: #FFF; border: 1.5px solid #E2E8F0; border-radius: 20px; padding: 40px; box-shadow: 0 10px 35px rgba(0,0,0,0.06); }
@media(max-width:640px) { .art-card { padding: 24px 18px; } }
.art-badge { display: inline-block; background: #FEF2F2; color: #E11D48; border: 1px solid rgba(225,29,72,0.2); font-weight: 800; font-size: 12px; padding: 4px 12px; border-radius: 20px; margin-bottom: 14px; text-transform: uppercase; }
.art-main-title { font-size: 28px; font-weight: 900; color: #0F172A; line-height: 1.35; margin-bottom: 16px; letter-spacing: -0.5px; }
@media(max-width:640px) { .art-main-title { font-size: 22px; } }
.art-meta-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; font-size: 13px; color: #64748B; padding-bottom: 16px; border-bottom: 1.5px solid #F1F5F9; margin-bottom: 24px; }
.art-author-box { display: flex; align-items: center; gap: 10px; font-weight: 700; color: #334155; }
.art-author-avatar { width: 36px; height: 36px; border-radius: 50%; background: #E11D48; color: #FFF; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 16px; }
.art-cover-img { width: 100%; max-height: 420px; object-fit: cover; border-radius: 14px; margin-bottom: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
.art-body-text { font-size: 17.5px; line-height: 1.85; color: #1E293B; font-weight: 500; }
.art-body-text p { margin-bottom: 20px; }
.art-body-text h2, .art-body-text h3 { color: #0F172A; font-weight: 900; margin: 28px 0 12px; line-height: 1.3; }
.art-body-text ul, .art-body-text ol { padding-left: 24px; margin-bottom: 20px; }
.art-body-text li { margin-bottom: 8px; }
.art-share-bar { margin-top: 40px; padding-top: 24px; border-top: 1.5px solid #F1F5F9; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
.share-btn { background: #25D366; color: #FFF; border: none; padding: 12px 22px; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
.copy-btn { background: #F1F5F9; color: #334155; border: 1.5px solid #CBD5E1; padding: 12px 22px; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>

<div class="art-hero">
  <div style="max-width:860px; margin:0 auto; padding:0 20px; display:flex; align-items:center; justify-content:space-between;">
    <a href="/news-explainers.html" style="color:#FFF; text-decoration:none; font-size:14px; font-weight:800; display:flex; align-items:center; gap:6px;">← ಸುದ್ದಿ ವಿಭಾಗಕ್ಕೆ ಹಿಂತಿರುಗಿ</a>
    <a href="/index.html"><img src="/karnata-logo.png" alt="Karnata.in Logo" style="height:36px; object-fit:contain;"></a>
  </div>
</div>

<div class="art-container">
  <div class="art-card">
    <span class="art-badge" id="art-category">📰 ಸುದ್ದಿ ವಿಶ್ಲೇಷಣೆ</span>
    <h1 class="art-main-title" id="art-title">ಲೋಡ್ ಆಗುತ್ತಿದೆ...</h1>
    
    <div class="art-meta-row">
      <div class="art-author-box">
        <div class="art-author-avatar">ಕರ್</div>
        <div>
          <div id="art-author">ಕರ್ನಾಟ ಸಂಪಾದಕೀಯ ತಂಡ</div>
          <div style="font-size:11px; color:#94A3B8; font-weight:600;" id="art-date">ಇಂದು</div>
        </div>
      </div>
      <div>🌐 Karnata.in Verified News</div>
    </div>

    <img id="art-cover" class="art-cover-img" style="display:none;" src="" alt="Featured Cover">

    <div class="art-body-text" id="art-body">
      <p>ವರದಿ ಲೋಡ್ ಆಗುತ್ತಿದೆ...</p>
    </div>

    <div class="art-share-bar">
      <a id="wa-share" href="#" target="_blank" rel="noopener" class="share-btn">📲 WhatsApp ಹಂಚಿಕೊಳ್ಳಿ</a>
      <button class="copy-btn" onclick="navigator.clipboard.writeText(window.location.href); alert('ಲಿಂಕ್ ಕಾಪಿ ಮಾಡಲಾಗಿದೆ!');">🔗 ಲಿಂಕ್ ಕಾಪಿ ಮಾಡಿ</button>
    </div>
  </div>
</div>

<script src="/data-loader.js"></script>
<script src="/nav-component.js"></script>
<script>
(async function initArticleView() {
  const params = new URLSearchParams(window.location.search);
  const articleId = params.get('id') || params.get('slug');

  if (!articleId) {
    document.getElementById('art-title').textContent = 'ವರದಿ ಸಿಗಲಿಲ್ಲ';
    document.getElementById('art-body').innerHTML = '<p>ದಯವಿಟ್ಟು ಸುದ್ದಿ ವಿಭಾಗದಿಂದ ಲೇಖನವನ್ನು ಆಯ್ಕೆ ಮಾಡಿ.</p>';
    return;
  }

  let article = null;

  // 1. Try local storage (nk_cms_articles)
  try {
    const store = JSON.parse(localStorage.getItem('nk_cms_articles') || '[]');
    article = store.find(x => x.id === articleId || x.id === decodeURIComponent(articleId));
  } catch(e) {}

  // 2. Try Worker API if not found in local storage
  if (!article) {
    try {
      const res = await fetch('https://karnata-cms.avinashaitoolstest2495.workers.dev/admin/api/articles');
      if (res.ok) {
        const data = await res.json();
        const articles = data.articles || [];
        article = articles.find(x => x.id === articleId || x.id === decodeURIComponent(articleId));
      }
    } catch(e) {}
  }

  // 3. Fallback to data/local_news.json
  if (!article) {
    try {
      const res = await fetch('/data/local_news.json');
      if (res.ok) {
        const raw = await res.json();
        const list = Object.values(raw.news || raw.district_buckets || {}).flat();
        article = list.find(x => x.id === articleId || x.url?.includes(articleId));
      }
    } catch(e) {}
  }

  if (article) {
    const title = article.title_kn || article.title || 'ಸುದ್ದಿ ವಿವರಣೆ';
    document.getElementById('page-title').textContent = `${title} — Karnata.in`;
    document.getElementById('art-title').textContent = title;
    document.getElementById('art-category').textContent = `📰 ${article.category || 'ಪ್ರಮುಖ ಲೇಖನ'}`;
    document.getElementById('art-author').textContent = article.author || article.source_name || article.source || 'ಕರ್ನಾಟ ಸಂಪಾದಕೀಯ ತಂಡ';
    document.getElementById('art-date').textContent = new Date(article.updated_at || article.published || Date.now()).toLocaleDateString('kn-IN', { day: 'numeric', month: 'long', year: 'numeric' });
    
    if (article.cover_image) {
      const img = document.getElementById('art-cover');
      img.src = article.cover_image;
      img.style.display = 'block';
    }

    document.getElementById('art-body').innerHTML = article.body_html || `<p>${article.summary_kn || article.summary || title}</p>`;
    
    const waText = encodeURIComponent(`*${title}*\n\nಇಲ್ಲಿ ಓದಿ: ${window.location.href}`);
    document.getElementById('wa-share').href = `https://api.whatsapp.com/send?text=${waText}`;
  } else {
    document.getElementById('art-title').textContent = 'ವರದಿ ಲೋಡ್ ಆಗಿಲ್ಲ';
    document.getElementById('art-body').innerHTML = '<p>ಈ ಲೇಖನದ ಸಂಪೂರ್ಣ ವಿವರ ಸದ್ಯದಲ್ಲೇ ಪ್ರಕಟವಾಗಲಿದೆ.</p>';
  }
})();
</script>
</body>
</html>
