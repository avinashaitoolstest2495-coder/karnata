name: Automatic Karnataka News, Gold, Dams, Weather & Petrol Scraper & Deploy

on:
  schedule:
    # Run every 30 minutes automatically 24/7
    - cron: '*/30 * * * *'
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: |
          npm install || true
          pip install requests beautifulsoup4 pandas urllib3 || true
          if [ -f scraper/requirements.txt ]; then pip install -r scraper/requirements.txt || true; fi

      - name: 📊 Run Gold, Dam Water Level, Weather, Petrol & Multi-Source District News Scrapers
        run: |
          python -c "import sys; sys.path.insert(0, 'scraper'); from gold_scraper import run; run()" || true
          python -c "import sys; sys.path.insert(0, 'scraper'); from petrol_scraper import run; run()" || true
          python -c "import sys; sys.path.insert(0, 'scraper'); from dam_scraper import run; run()" || true
          python -c "import sys; sys.path.insert(0, 'scraper'); from weather_scraper import run; run()" || true
          python -c "import sys; sys.path.insert(0, 'scraper'); from apmc_scraper import run; run()" || true
          python -c "import sys; sys.path.insert(0, 'scraper'); from local_news_scraper import run; run()" || true

      - name: 📰 Run Live News, District Pages Rebuild & Sitemap Generator
        run: |
          node scripts/scrape_real_karnataka_news.js || true
          python scripts/build_cms.py || true
          python scraper/generate_morning_bulletin.py || true
          python scripts/rebuild_all_district_pages.py || true
          python scripts/generate_sitemap.py || true
          node scripts/build_all_district_news.js || true
          node scripts/build_seo_and_monetization.js || true

      - name: 💾 Commit & Push Updated Data to GitHub Main
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A || true
          git commit -m "auto: 30-min scraped update & district pages rebuild [skip ci]" || echo "No data changes to commit"
          git push origin main || echo "Push completed or skipped"

      - name: 🚀 Deploy to Cloudflare Pages (if tokens configured)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx wrangler pages deploy . --project-name=karnata --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
