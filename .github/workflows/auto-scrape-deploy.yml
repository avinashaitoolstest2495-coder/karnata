name: Automatic Karnataka News, Gold, Dams, Weather & Petrol Scraper & Cloudflare Deploy

on:
  schedule:
    # Run every 30 minutes automatically
    - cron: '*/30 * * * *'
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: [self-hosted]
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies & Playwright
        run: |
          if [ -f package.json ]; then npm install || true; fi
          if [ -f scraper/requirements.txt ]; then pip install -r scraper/requirements.txt || true; fi
          pip install requests beautifulsoup4 pandas playwright || true

      - name: 📊 Run Gold, Dam Water Level, Weather & Petrol Scrapers
        run: |
          python -c "import sys; sys.path.insert(0, 'scraper'); from gold_scraper import run; run()" || true
          python -c "import sys; sys.path.insert(0, 'scraper'); from petrol_scraper import run; run()" || true
          python -c "import sys; sys.path.insert(0, 'scraper'); from dam_scraper import run; run()" || true
          python -c "import sys; sys.path.insert(0, 'scraper'); from weather_scraper import run; run()" || true
          python -c "import sys; sys.path.insert(0, 'scraper'); from apmc_scraper import run; run()" || true

      - name: 📰 Run Live News & SEO Aggregators
        run: |
          node scripts/scrape_real_karnataka_news.js || true
          node scripts/build_all_district_news.js || true
          node scripts/build_seo_and_monetization.js || true

      - name: 💾 Commit & Push Updated Data to GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ sitemap.xml robots.txt ads.txt || true
          git commit -m "auto: 30-min scraped update (gold, dams, weather, petrol, news) [skip ci]" || echo "No data changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main || echo "Push skipped"

      - name: 🚀 Deploy to Cloudflare Pages
        run: |
          npx wrangler pages deploy . --project-name=karnata --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
