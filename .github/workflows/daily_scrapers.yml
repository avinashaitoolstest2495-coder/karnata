name: Karnata 24/7 Automated Cloud Scrapers

on:
  schedule:
    # Run every hour 24/7 online in GitHub Actions Cloud
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          if [ -f scraper/requirements.txt ]; then pip install -r scraper/requirements.txt; fi
          pip install playwright schedule fake-useragent
          playwright install --with-deps chromium

      - name: Run Online Smart Scheduler (Live Data Feeds Only)
        run: |
          python scraper/smart_scheduler.py --all

      - name: Commit & Push Updated Data to GitHub Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json data/history/*.json || true
          git status
          git diff-index --quiet HEAD || (git commit -m "🤖 Auto-update live Karnataka data feeds [skip ci]" && git push)

      - name: Deploy Updated Live Data to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=karnata --commit-dirty=true
        continue-on-error: true

