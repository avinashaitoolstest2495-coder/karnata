name: Daily Karnataka Gold & Silver Rate Updater

on:
  schedule:
    # 04:15 UTC = 09:45 AM IST (Morning bullion market opening)
    - cron: '15 4 * * *'
    # 05:00 UTC = 10:30 AM IST (Confirmed daily showroom rates)
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  update-gold-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Scrape Official Jos Alukkas Live Rates (Zero Mock Data)
        run: |
          python -c "import sys; sys.path.insert(0, 'scraper'); from gold_scraper import run; run()"

      - name: Sync Static DOMs & Pre-render HTML
        run: |
          python scripts/sync_all_static_dom.py

      - name: Dynamically Synchronize Gold Ecosystem
        run: |
          python scripts/sync_gold_ecosystem.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ gold-rate.html index.html _worker.js ask-ai-engine.js
          git commit -m "chore(gold): daily authentic Jos Alukkas rate update [skip ci]" || echo "No changes to commit"
          git push || echo "Push skipped or not needed"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=karnata --commit-dirty=true
        continue-on-error: true
