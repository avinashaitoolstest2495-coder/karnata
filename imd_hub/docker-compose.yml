version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://imd_user:imd_password@postgres:5432/imd_weather_db
      - ADMIN_API_KEY=nk_admin_secret_2026
      - IMD_SOURCE_URL=https://internal.imd.gov.in/power/SRLDC/Karnatak.html
      - TIMEZONE=Asia/Kolkata
    depends_on:
      - postgres
    restart: always

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: imd_user
      POSTGRES_PASSWORD: imd_password
      POSTGRES_DB: imd_weather_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
